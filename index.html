<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ステッカールーレット</title>
<style>
  :root{
    --bg:#050506; --panel:#0b0c0f; --panel2:#0f1116; --line:#1c2a30;
    --neon:#7fffd4; --neon-soft:#a8ffe6; --neon-dim:#2f6f5e;
    --txt:#eafff8; --sub:#6f8b88;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 50% -15%, rgba(127,255,212,.10) 0%, transparent 60%);
    background-repeat:no-repeat;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    min-height:100vh;padding:24px 16px 48px;display:flex;justify-content:center;
  }
  .app{width:100%;max-width:520px}
  header{text-align:center;margin-bottom:22px}
  h1{
    font-size:21px;margin:0 0 9px;letter-spacing:.14em;font-weight:800;
    color:var(--neon);
    text-shadow:0 0 8px rgba(127,255,212,.75), 0 0 26px rgba(127,255,212,.4);
  }
  .tagline{color:var(--sub);font-size:12.5px;margin:0;line-height:1.7}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line);border-radius:16px;padding:20px;
    box-shadow:0 0 0 1px rgba(127,255,212,.04), 0 10px 30px rgba(0,0,0,.6);
  }
  label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 8px;
    text-align:center;letter-spacing:.1em}
  input[type=text]{
    width:100%;padding:15px 16px;border-radius:11px;border:1px solid var(--line);
    background:#07080a;color:var(--neon);
    font-size:19px;font-family:inherit;outline:none;text-align:center;letter-spacing:.1em;
  }
  input[type=text]::placeholder{color:#3d5a55;letter-spacing:.02em}
  input[type=text]:focus{
    border-color:var(--neon);
    box-shadow:0 0 0 2px rgba(127,255,212,.15), 0 0 16px rgba(127,255,212,.3);
  }
  .primary{
    width:100%;padding:16px;border:0;border-radius:11px;cursor:pointer;
    background:var(--neon);color:#04140f;
    font-size:15px;font-weight:800;font-family:inherit;letter-spacing:.16em;
    box-shadow:0 0 18px rgba(127,255,212,.55), 0 0 40px rgba(127,255,212,.22);
    margin-top:14px;
  }
  .primary:active{transform:translateY(1px);box-shadow:0 0 10px rgba(127,255,212,.4)}
  .primary:disabled{opacity:.4;box-shadow:none;cursor:default;transform:none}
  .ghost{
    background:transparent;border:1px solid var(--neon-dim);color:var(--neon-soft);
    border-radius:10px;padding:13px;width:100%;cursor:pointer;
    font-family:inherit;font-size:13px;letter-spacing:.06em;
  }
  .ghost:hover{border-color:var(--neon);box-shadow:0 0 12px rgba(127,255,212,.3)}
  .status{font-size:12.5px;color:var(--sub);text-align:center;min-height:18px;
    margin-top:10px;line-height:1.7}
  .warn{color:#ff8fab}
  .wheelwrap{position:relative;display:flex;justify-content:center;align-items:center;margin:6px 0 18px}
  canvas#wheel{
    width:100%;max-width:330px;height:auto;display:block;
    filter:drop-shadow(0 0 18px rgba(127,255,212,.35));
  }
  .pointer{
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:22px solid var(--neon);
    position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    filter:drop-shadow(0 0 8px rgba(127,255,212,.8));
  }
  .result{text-align:center;padding:10px 0 4px}
  .result .who{font-size:12px;color:var(--sub);letter-spacing:.3em;margin-bottom:10px}
  .result .name{
    font-size:32px;font-weight:800;line-height:1.3;word-break:break-word;
    letter-spacing:.1em;color:var(--neon);
    text-shadow:0 0 10px rgba(127,255,212,.8), 0 0 34px rgba(127,255,212,.45);
  }
  .result .prize{
    display:inline-block;margin-top:16px;padding:9px 22px;border-radius:999px;
    background:rgba(127,255,212,.08);border:1px solid rgba(127,255,212,.5);
    color:var(--neon);font-size:14px;font-weight:700;letter-spacing:.08em;
    box-shadow:0 0 16px rgba(127,255,212,.3);
  }
  .result .note{font-size:12.5px;color:var(--sub);margin-top:16px;line-height:1.7}
  .hide{display:none !important}
  .footer{text-align:center;font-size:11px;color:#4a6a63;line-height:1.9;margin-top:22px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ステッカールーレット</h1>
    <p class="tagline">合言葉を入れた人だけ回せます<br>最後までいてくれた人へのプレゼント抽選</p>
  </header>

  <section class="card" id="gate">
    <label for="keyInput">合言葉を入力</label>
    <input type="text" id="keyInput" placeholder="配信で発表した合言葉" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="gateBtn">ルーレットを開く</button>
    <div class="status" id="gateStatus"></div>
  </section>

  <section class="card hide" id="spinBox">
    <div class="wheelwrap">
      <canvas id="wheel" width="700" height="700"></canvas>
      <div class="pointer"></div>
    </div>
    <button class="primary" id="spinBtn" style="margin-top:0">ルーレットを回す</button>
    <div class="status" id="spinStatus"></div>
  </section>

  <section class="card hide" id="doneBox">
    <div class="result">
      <div class="who" id="resWho">RESULT</div>
      <div class="name" id="resName">—</div>
      <div class="prize hide" id="resPrize"></div>
      <div class="note" id="resNote"></div>
    </div>
    <div style="margin-top:20px">
      <button class="ghost" id="shotBtn">この画面を画像で保存</button>
    </div>
    <p class="footer" style="margin-top:14px">当たったらこの画面をスクショして主催者に送ってください。</p>
  </section>
</div>

<script>
const KEYS = ["にょろ最高"];
const PRIZES = ["ステッカーセット"];
const WIN_RATE = 0.1000;

const D = id => document.getElementById(id);

function normalize(s){
  let t = String(s);
  t = t.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  t = t.replace(/　/g, "");
  t = t.replace(/[\s\uFEFF]+/g, "");
  return t.toLowerCase();
}
const NKEYS = KEYS.map(normalize);

function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickPrize(){ return PRIZES[Math.floor(Math.random()*PRIZES.length)]; }

const LOSE_COUNT = Math.max(1, Math.round((1 - WIN_RATE) / WIN_RATE));
const TOTAL = LOSE_COUNT + 1;
let SEG_IS_WIN = [];
let WIN_INDEX = 0;

function buildSegments(){
  const idx = []; for (let i=0;i<TOTAL;i++) idx.push(i);
  shuffle(idx);
  WIN_INDEX = idx.indexOf(0);
  SEG_IS_WIN = []; for (let i=0;i<TOTAL;i++) SEG_IS_WIN.push(i === WIN_INDEX);
}

D("gateBtn").onclick = () => {
  const typed = normalize(D("keyInput").value);
  if (!typed){ D("gateStatus").textContent = "合言葉を入れてください。"; D("gateStatus").className = "status warn"; return; }
  if (!NKEYS.includes(typed)){
    D("gateStatus").textContent = "合言葉がちがいます。配信のコメントを確認してください。";
    D("gateStatus").className = "status warn"; return;
  }
  D("gate").classList.add("hide");
  D("spinBox").classList.remove("hide");
  buildSegments(); drawWheel(spinAngle);
};
D("keyInput").addEventListener("keydown", e => { if (e.key === "Enter") D("gateBtn").click(); });

const cv = D("wheel");
const ctx = cv.getContext("2d");
let spinAngle = -18;

function drawWheel(deg){
  const W = cv.width, R = W/2, cx = W/2, cy = W/2;
  ctx.clearRect(0,0,W,W);
  const N = TOTAL, seg = 2*Math.PI/N, base = deg * Math.PI/180;
  for (let i=0;i<N;i++){
    const a0 = base + i*seg, a1 = a0 + seg, isWin = SEG_IS_WIN[i];
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R-8,a0,a1); ctx.closePath();
    ctx.fillStyle = isWin ? "#7fffd4" : (i % 2 === 0 ? "#12161c" : "#0b0e12");
    ctx.fill();
    ctx.strokeStyle = isWin ? "#a8ffe6" : "#1c2a30";
    ctx.lineWidth = isWin ? 4 : 3;
    if (isWin){ ctx.shadowColor = "rgba(127,255,212,.9)"; ctx.shadowBlur = 18; }
    ctx.stroke();
    ctx.shadowBlur = 0;
    const fs = N <= 8 ? 40 : N <= 12 ? 32 : N <= 18 ? 24 : 18;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(a0 + seg/2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    if (isWin){
      ctx.fillStyle = "#04140f"; ctx.font = "bold " + fs + "px sans-serif";
    } else {
      ctx.fillStyle = "#4f6f6a"; ctx.font = fs + "px sans-serif";
    }
    ctx.fillText(isWin ? "当たり" : "ハズレ", R-46, 0); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,72,0,Math.PI*2);
  ctx.fillStyle = "#07080a"; ctx.fill();
  ctx.strokeStyle = "#7fffd4"; ctx.lineWidth = 6;
  ctx.shadowColor = "rgba(127,255,212,.8)"; ctx.shadowBlur = 16;
  ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = "#7fffd4"; ctx.font = "bold 34px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("★", cx, cy+2);
  ctx.beginPath(); ctx.arc(cx,cy,R-8,0,Math.PI*2);
  ctx.strokeStyle = "#7fffd4"; ctx.lineWidth = 8;
  ctx.shadowColor = "rgba(127,255,212,.9)"; ctx.shadowBlur = 22;
  ctx.stroke(); ctx.shadowBlur = 0;
}

let spinning = false;

function spin(){
  if (spinning) return;
  spinning = true; D("spinBtn").disabled = true; D("spinStatus").textContent = "";
  const win = Math.random() < WIN_RATE;
  let target_i = WIN_INDEX;
  if (!win){
    const cands = []; for (let i=0;i<TOTAL;i++) if (i !== WIN_INDEX) cands.push(i);
    target_i = cands[Math.floor(Math.random()*cands.length)];
  }
  const segAngle = 360/TOTAL;
  const segCenter = target_i*segAngle + segAngle/2;
  const jitter = (Math.random()-0.5)*(segAngle*0.55);
  const turns = 6 + Math.floor(Math.random()*3);
  const target = 360*turns - (segCenter + jitter) + 90;
  if (!win){
    let n = 0;
    const iv = setInterval(()=>{ n++; D("spinStatus").textContent = ["…","……","あと少し…","ドキドキ…"][n % 4]; if (n > 16) clearInterval(iv); }, 250);
  }
  animateTo(target, 4200, () => {
    if (win){
      D("resWho").textContent = "WINNER";
      D("resName").textContent = "おめでとう！";
      D("resPrize").textContent = pickPrize();
      D("resPrize").classList.remove("hide");
      D("resNote").textContent = "この画面をスクショして主催者に送ってください。";
    } else {
      D("resWho").textContent = "RESULT";
      D("resName").textContent = "はずれ…";
      D("resPrize").classList.add("hide");
      D("resNote").textContent = "また配信に来てくれたらその時に！";
    }
    D("spinBox").classList.add("hide");
    D("doneBox").classList.remove("hide");
    spinning = false;
  });
}
D("spinBtn").onclick = spin;

function animateTo(target, duration, done){
  const start = spinAngle, delta = target - start, t0 = performance.now();
  (function frame(now){
    const p = Math.min(1, (now - t0)/duration);
    const e = 1 - Math.pow(1-p, 4);
    spinAngle = start + delta*e;
    drawWheel(spinAngle);
    if (p < 1) requestAnimationFrame(frame);
    else { spinAngle = ((target % 360) + 360) % 360; drawWheel(spinAngle); done && done(); }
  })(t0);
}

D("shotBtn").onclick = () => {
  D("resNote").textContent = "端末のスクショ機能でこの画面を保存してください。";
};

buildSegments();
drawWheel(spinAngle);
</script>
</body>
</html>
